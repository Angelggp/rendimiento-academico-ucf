services:
  postgres:
    image: postgres:16-alpine
    container_name: rendimiento_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-rendimiento_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rendimiento_pass}
      POSTGRES_DB: ${DB_NAME:-rendimiento_academico}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rendimiento_user}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
