services:
  postgres:
    image: postgres:16-alpine
    container_name: rendimiento_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rendimiento_user
      POSTGRES_PASSWORD: rendimiento_pass
      POSTGRES_DB: rendimiento_academico
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rendimiento_user -d rendimiento_academico"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
